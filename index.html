<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Secure Website Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&display=swap');
    body {
      background: #18191a;
      color: #fff;
      font-family: 'Montserrat', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: #232526;
      padding: 38px 34px 34px 34px;
      border-radius: 18px;
      box-shadow: 0 8px 32px 0 #0008;
      min-width: 340px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .login-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -1.5px;
    }
    .login-container label {
      font-weight: 500;
      margin-top: 12px;
      margin-bottom: 4px;
      display: block;
      width: 100%;
    }
    .login-container input[type="text"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid #36373a;
      background: #191a1d;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 8px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-container input[type="text"]:focus,
    .login-container input[type="password"]:focus {
      border-color: #f99;
    }
    .login-container button {
      margin-top: 16px;
      width: 100%;
      background: linear-gradient(90deg, #e44d26 10%, #f99 90%);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.3s, opacity 0.2s;
    }
    .login-container button:hover {
      opacity: 0.92;
    }
    .login-footer {
      margin-top: 20px;
      font-size: 0.96rem;
      color: #aaa;
    }
    .error-message {
      color: #e44d26;
      margin: 10px 0 5px 0;
      font-size: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <form class="login-container" autocomplete="off" id="loginForm" onsubmit="return validateLogin();">
    <div class="login-title">Sign In</div>
    <div class="error-message" id="errorMsg">Incorrect username or password.</div>
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter your username" required>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password" required>
    <button type="submit">Login</button>
    <div class="login-footer">
      Forgot your password? <a href="#">Reset it</a>
    </div>
  </form>
  <script>
    function validateLogin() {
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value.trim();
      var errorMsg = document.getElementById('errorMsg');
      // Change credentials as needed
      if (username === 'KSHITIJ' && password === '12345') {
        window.location.href = '1.html';
        return false;
      } else {
        errorMsg.style.display = 'block';
        return false;
      }
    }
  </script>
</body>
</html>
